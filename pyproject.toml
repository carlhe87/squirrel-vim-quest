[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squirrel-vim-quest"
dynamic = ["version"]
description = "Learn Vim motions with Pip the squirrel: a terminal game for young kids."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.2", "pyyaml>=6", "comtypes>=1.4; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6"]

[project.scripts]
squirrel-vim-quest = "squirrel_vim_quest.app:main"

[tool.setuptools.dynamic]
version = { attr = "squirrel_vim_quest.__version__" }

[tool.setuptools.packages.find]
include = ["squirrel_vim_quest*"]

[tool.setuptools.package-data]
squirrel_vim_quest = ["levels/*/*.yaml", "strings/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
